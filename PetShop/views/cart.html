<div class="d-flex align-items-center justify-content-between mb-3">
  <h1 class="h3 mb-0">Korpa / Porudzbine</h1>
  <div class="h5 mb-0">Ukupno: {{vm.total}}€</div>
</div>

<div class="list-group">
  <div class="list-group-item d-flex align-items-center gap-3" ng-repeat="it in vm.items">
    <div class="fw-bold">{{it.name}}</div>
    <div class="text-muted">Cena: {{it.price}}€</div>
    <div class="ms-auto d-flex align-items-center gap-2">
      <select class="form-select form-select-sm w-auto" ng-model="it.status" ng-options="s for s in vm.statusOptions" ng-change="vm.update(it)"></select>
      <button class="btn btn-sm btn-outline-danger" ng-click="vm.remove(it)">Obrisi</button>
    </div>
  </div>
  <div class="text-muted" ng-if="vm.items.length===0">Korpa je prazna.</div>
</div>
