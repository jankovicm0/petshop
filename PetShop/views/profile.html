<h1 class="h3 mb-3">Profil</h1>
<form class="card card-body">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Ime</label><input class="form-control" ng-model="vm.profile.firstName"></div>
    <div class="col-md-6"><label class="form-label">Prezime</label><input class="form-control" ng-model="vm.profile.lastName"></div>
    <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" ng-model="vm.profile.email"></div>
    <div class="col-md-6"><label class="form-label">Telefon</label><input class="form-control" ng-model="vm.profile.phone"></div>
    <div class="col-md-12"><label class="form-label">Adresa</label><input class="form-control" ng-model="vm.profile.address"></div>
  </div>
  <div class="mt-3"><button type="button" class="btn btn-primary" ng-click="vm.save()">Sačuvaj</button></div>
</form>
