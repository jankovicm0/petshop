<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digitalna prodavnica kućnih ljubimaca — Prototip</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body ng-app="petShopApp">

  <aside class="ps-sidebar d-none d-lg-flex flex-column">
    <a class="ps-brand" href="#/">Pet Shop</a>

    <nav class="nav flex-column ps-nav">
      <a class="nav-link" href="#/">Katalog</a>
      <a class="nav-link" href="#/cart">Korpa</a>
      <a class="nav-link" href="#/profile">Profil</a>
      <a class="nav-link" href="#/auth">Prijava</a>
    </nav>

  </aside>

  <nav class="navbar navbar-dark ps-topbar d-lg-none">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobiSidebar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <a class="navbar-brand ms-2" href="#/">Pet Shop</a>
    </div>
  </nav>

  <div class="offcanvas offcanvas-start ps-offcanvas" tabindex="-1" id="mobiSidebar">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title text-white">Pet Shop</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
      <nav class="nav flex-column">
        <a class="nav-link" href="#/" data-bs-dismiss="offcanvas">Katalog</a>
        <a class="nav-link" href="#/cart" data-bs-dismiss="offcanvas">Korpa</a>
        <a class="nav-link" href="#/profile" data-bs-dismiss="offcanvas">Profil</a>
        <a class="nav-link" href="#/auth" data-bs-dismiss="offcanvas">Prijava</a>
      </nav>
      <div class="mt-3">
        <a class="btn btn-outline-primary w-100" href="#/" data-bs-dismiss="offcanvas">🔎 Filteri (u Katalogu)</a>
      </div>
    </div>
  </div>

  <main class="ps-main" id="captureArea">
    <div ng-view></div>
  </main>

  <div ng-controller="ChatController" class="chat-container" ng-class="{'open': chat.open}">
    <button class="btn btn-primary chat-toggle shadow" ng-click="toggle()">💬 ChatBot</button>
    <div class="card chat-box shadow-lg">
      <div class="card-header d-flex justify-content-between align-items-center">
        <strong>{{chat.name}}</strong>
        <button class="btn btn-sm btn-outline-light" ng-click="toggle()">✕</button>
      </div>
      <div class="card-body chat-messages">
        <div class="text-muted small mb-2">
          Zdravo! Ovde sam da ti pomognem, pitaj me sta te zanima.
        </div>
        <div ng-repeat="m in chat.messages track by $index" class="mb-2">
          <div ng-class="{'text-end': m.me}">
            <span class="badge bg-secondary" ng-if="!m.me">Chat Bot</span>
            <span class="badge bg-info text-dark" ng-if="m.me">Ti</span>
          </div>
          <div class="bubble" ng-class="{'me': m.me}">{{m.text}}</div>
        </div>
      </div>
      <div class="card-footer">
        <form ng-submit="send()">
          <div class="input-group">
            <input class="form-control" ng-model="chat.input" placeholder="Posalji poruku" />
            <button class="btn btn-primary" type="submit">Posalji</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-route.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <script src="app.js"></script>
  <script src="services/storage.service.js"></script>
  <script src="services/data.service.js"></script>
  <script src="controllers/catalog.controller.js"></script>
  <script src="controllers/pet.controller.js"></script>
  <script src="controllers/cart.controller.js"></script>
  <script src="controllers/profile.controller.js"></script>
  <script src="controllers/auth.controller.js"></script>
  <script src="controllers/docs.controller.js"></script>
  <script src="controllers/chat.controller.js"></script>
</body>
</html>
